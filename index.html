<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Fundamentals</title>

    <!-- React creates the components. -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <!-- ReactDOM displays the components in the browser. -->
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel converts JSX into JavaScript that the browser understands. -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #172033;
            background: #eef5ff;
        }

        h1 {
            color: #087ea4;
        }

        .example {
            margin-bottom: 20px;
            padding: 20px;
            border-left: 5px solid #087ea4;
            border-radius: 8px;
            background: white;
        }

        .example h2 {
            color: #087ea4;
        }
    </style>
</head>
<body>
    <h1>React Fundamentals</h1>
    <p>Each box below is rendered by its own practice.jsx file.</p>

    <section id="topic-1" class="example"></section>
    <section id="topic-2" class="example"></section>
    <section id="topic-3" class="example"></section>
    <section id="topic-4" class="example"></section>
    <section id="topic-5" class="example"></section>
    <section id="topic-6" class="example"></section>
    <section id="topic-7" class="example"></section>
    <section id="topic-8" class="example"></section>
    <section id="topic-9" class="example"></section>
    <section id="topic-10" class="example"></section>

    <script type="text/babel" src="module-1-react-fundamentals/01-what-is-react/practice.jsx"></script>
    <script type="text/babel" src="module-1-react-fundamentals/02-react-reactdom-jsx-typescript/practice.jsx"></script>
    <script type="text/babel" src="module-1-react-fundamentals/03-components/practice.jsx"></script>
    <script type="text/babel" src="module-1-react-fundamentals/04-jsx/practice.jsx"></script>
    <script type="text/babel" src="module-1-react-fundamentals/05-props/practice.jsx"></script>
    <script type="text/babel" src="module-1-react-fundamentals/06-children-and-composition/practice.jsx"></script>
    <script type="text/babel" src="module-1-react-fundamentals/07-one-way-data-flow/practice.jsx"></script>
    <script type="text/babel" src="module-1-react-fundamentals/08-purity-render-and-commit/practice.jsx"></script>
    <script type="text/babel" src="module-1-react-fundamentals/09-conditional-rendering/practice.jsx"></script>
    <script type="text/babel" src="module-1-react-fundamentals/10-lists-and-keys/practice.jsx"></script>
</body>
</html>
